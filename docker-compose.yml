# Full stack (API + UI + local VLM):   docker compose --profile ollama up --build
# Lite stack (no VLM download):         VLM_PROVIDER=mock docker compose up --build
services:
  api:
    build: .
    image: pcb-inspector:latest
    ports: ["8000:8000"]
    environment:
      MODEL_PATH: /app/models/best.onnx
      DEVICE: cpu
      VLM_PROVIDER: ${VLM_PROVIDER:-ollama}
      OLLAMA_HOST: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5vl:3b}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      VLM_POLICY: ${VLM_POLICY:-flag}
      REPORT_MODE: ${REPORT_MODE:-llm}
      VLM_TIMEOUT: ${VLM_TIMEOUT:-90}
      LOG_DIR: /app/logs
    volumes:
      - ./models:/app/models:ro
      - ./logs:/app/logs
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 40s

  ui:
    image: pcb-inspector:latest
    command: ["streamlit", "run", "app/streamlit_app.py", "--server.port=8501", "--server.address=0.0.0.0"]
    ports: ["8501:8501"]
    environment:
      API_URL: http://api:8000
    depends_on: [api]

  # ---- local VLM/LLM (enabled with --profile ollama) ----
  ollama:
    image: ollama/ollama:latest
    profiles: ["ollama"]
    ports: ["11434:11434"]
    volumes:
      - ollama_models:/root/.ollama   # model weights live in this Docker volume (delete it to reclaim disk)
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 10

  ollama-pull:
    image: ollama/ollama:latest
    profiles: ["ollama"]
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: http://ollama:11434
    entrypoint: ["ollama", "pull", "${OLLAMA_MODEL:-qwen2.5vl:3b}"]
    restart: "no"

volumes:
  ollama_models:
